name: Svelto.Common NuGet Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: verify release version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          CSPROJ_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Svelto.Common/Svelto.Common.csproj').read()).group(1))")
          test "$VERSION" = "$CSPROJ_VERSION" || { echo "package.json version ($VERSION) != Svelto.Common.csproj PackageVersion ($CSPROJ_VERSION)"; exit 1; }

      - name: pack
        run: dotnet pack Svelto.Common/Svelto.Common.csproj -c Release -o temp

      - name: push
        run: dotnet nuget push "temp/Svelto.Common.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
